plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.devtools.ksp"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
       keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "edu.perfect"
    // AppFunctions (androidx.appfunctions) needs compileSdk 37.
    compileSdkVersion Math.max(flutter.compileSdkVersion, 37)
    ndkVersion "29.0.14206865"

    compileOptions {
    // Flag to enable support for the new language APIs
    coreLibraryDesugaringEnabled true
    // Java 11: androidx.appfunctions targets it, and Kotlin cannot inline its
    // code into Java 8 bytecode.
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "edu.perfect"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion '21'
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        testInstrumentationRunner "pl.leancode.patrol.PatrolJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: "true"

        manifestPlaceholders += [pdftronLicenseKey:PDFTRON_LICENSE_KEY]
        multiDexEnabled true
    }

     signingConfigs {
           release {
               keyAlias keystoreProperties['keyAlias']
               keyPassword keystoreProperties['keyPassword']
               storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
               storePassword keystoreProperties['storePassword']
           }
       }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
            // Enable shrinking, obfuscation, and optimization for release builds
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro'
        }
    }

    // testBuildType "release"

    testOptions {
          execution "ANDROIDX_TEST_ORCHESTRATOR"
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

flutter {
    source '../..'
}

ksp {
    // Lets the AppFunctions compiler collect the functions into one service.
    arg("appfunctions:aggregateAppFunctions", "true")
}

dependencies {
    androidTestUtil "androidx.test:orchestrator:1.4.2"
    implementation "com.android.support:multidex:18.0.0"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'

    //Temporare for flutter local notifications
    implementation 'androidx.window:window:1.0.0'
    implementation 'androidx.window:window-java:1.0.0'

    // Assistant: AppFunctions for Gemini (PerfectAppFunctions.kt, AssistantBridge.kt).
    implementation "androidx.appfunctions:appfunctions:1.0.0-beta01"
    ksp "androidx.appfunctions:appfunctions-compiler:1.0.0-beta01"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
}
