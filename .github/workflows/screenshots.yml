name: Update screenshots

on:
  push:
    branches-ignore: [main, master, develop]
    paths:
      - 'lib/presentation/**'
      - 'lib/common/**'
      - 'lib/main.dart'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'test/screenshots/**'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    # Skip the commit this workflow pushes itself, so it never loops.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Goldens are rendered on Linux so the output is identical on every run.
      - name: Regenerate screenshots
        run: flutter test --update-goldens test/screenshots

      - name: Commit changed screenshots
        run: |
          if [ -z "$(git status --porcelain docs/screenshots)" ]; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update app screenshots [skip ci]"
          git push
